name: Build (Android Native)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Test Binaries (Android Native)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      # Gradle exposes test-binary link tasks for androidNative* targets,
      # but no executable test task in this project. Build the test
      # executables explicitly so test code is compiled and linked for each
      # Android Native ABI; do not claim JUnit-style execution here.
      - name: Build Android Native test binaries
        run: >
          ./gradlew
          androidNativeArm32TestBinaries
          androidNativeArm64TestBinaries
          androidNativeX86TestBinaries
          androidNativeX64TestBinaries
          --no-configuration-cache
